serial_number: a300-00096
version: 0
system:
  hosts:
    - hostname: cpr-a300-00096
      ip: 192.168.131.1
  ros2:
    username: robot
    namespace: a300_00096
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
      discovery: server
      servers:
        - hostname: cpr-a300-00096
    workspaces:
      - /home/robot/colcon_ws/install/setup.bash
platform:
  battery:
    model: S_24V20_U1
    configuration: S1P2
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a300.top_plate
  mcu:
    protocol: proton
links:
  mesh:
    - name: sensor_arch
      parent: top_plate_default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      visual:
        package: senai02_description
        path:  meshes/sensor_arch.stl
sensors:
  imu:
    - model: phidgets_spatial
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.059, 0.0, 0.161275]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        phidgets_spatial:
          data_interval_ms: 20
  ins:
    - model: fixposition
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [-0.16825, 0.0, 0.68052]
      rpy: [0.0, 0.0, 0.0]
      antennas:
        - type: spherical
          parent: ins_0_base_link
          xyz: [0.00825, 0.231, 0.01524]
          rpy: [0.0, 0.0, 0.0]
        - type: spherical
          parent: ins_0_base_link
          xyz: [0.00825, -0.231, 0.01524]
          rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        fixposition_driver:
          stream: tcpcli://192.168.131.35:21000
          messages:
            - "FP_A-ODOMETRY"
            - "FP_A-ODOMENU"
            - "FP_A-ODOMSH"
            - "FP_A-ODOMSTATUS"
            - "FP_A-LLH"
            - "FP_A-CORRIMU"
            - "FP_A-TEXT"
            - "FP_A-GNSSANT"
            - "FP_A-GNSSCORR"
            - "NOV_B-BESTGNSSPOS"
          nmea_epoch: "FUSION"
          fp_output.ip: "192.168.131.35"
