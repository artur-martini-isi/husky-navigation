# Follow-me por marcador ArUco. O alvo é uma etiqueta impressa levada pela pessoa.
/**:
  follow_me:
    ros__parameters:
      image_topic: 'zed/left/image_raw'
      camera_info_topic: 'zed/left/camera_info'
      scan_topic: 'scan'
      marker_dict: 'DICT_4X4_50'
      marker_id: -1                # -1 segue qualquer marcador do dicionário (o do laboratório é o id 2)
      marker_size_m: 0.17          # lado do quadrado preto impresso (medido com régua no laboratório)
      camera_xyz: [0.25, 0.0, 0.60]   # pose da ZED em base_link — MEDIR
      camera_yaw_deg: 0.0
      target_distance: 1.5
      distance_deadband: 0.20
      bearing_deadband_deg: 4.0
      k_linear: 0.6
      k_angular: 1.2
      max_linear: 0.4              # indoor: comece baixo
      max_angular: 0.8
      min_linear: 0.08
      allow_reverse: true
      control_rate: 10.0
      target_timeout: 1.5
      obstacle_stop_distance: 0.9
      obstacle_half_angle_deg: 35.0
      target_mask_deg: 20.0        # setor mínimo do alvo ignorado pela guarda
      target_width_m: 0.9          # largura da pessoa: o setor cresce quando ela está perto
      target_mask_range_m: 0.6     # só ignora retornos que estejam à mesma distância do alvo
      scan_timeout: 1.5
      require_joy: true
      joy_timeout: 1.0
      joy_start_button: 9
      joy_stop_button: 1
      joy_enable_buttons: [4, 5]
