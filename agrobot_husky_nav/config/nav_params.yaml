/**:
  livox_to_scan:
    ros__parameters:
      target_frame: base_link       # scan expressed in the robot frame
      transform_tolerance: 0.05
      min_height: 0.20              # m above base_link: ignore ground and small bumps
      max_height: 1.20              # m: ignore things above the robot
      angle_min: -3.14159
      angle_max: 3.14159
      angle_increment: 0.00873      # 0.5 deg
      scan_time: 0.1
      range_min: 0.60              # >0.3: the MID360 sees the sensor arch/antennas at ~0.3 m
      range_max: 20.0
      use_inf: true
      inf_epsilon: 1.0
      queue_size: 2
  gps_waypoint_follower:
    ros__parameters:
      control_rate: 10.0
      max_linear: 0.5
      min_linear: 0.15
      max_angular: 0.6
      k_angular: 1.2
      turn_in_place_angle: 1.0
      slowdown_angle: 0.6
      slowdown_distance: 2.0
      waypoint_tolerance: 0.8
      waypoint_timeout: 180.0
      heading_offset_deg: 0.0
      require_global_init: true
      pose_timeout: 1.0
      obstacle_enabled: true
      obstacle_half_angle: 0.6
      obstacle_stop_distance: 1.2
      obstacle_slow_distance: 3.0
      obstacle_min_points: 3
      obstacle_steer: false
      obstacle_steer_gain: 0.4
      scan_timeout: 1.0
      require_joy: true
      joy_timeout: 1.0
      joy_start_button: 9           # PS4 Options
      joy_stop_button: 1            # PS4 Circle
      joy_teleop_enable_button: 4   # PS4 L1 (same as teleop_twist_joy enable_button)
      joy_turbo_button: 5           # PS4 R1
